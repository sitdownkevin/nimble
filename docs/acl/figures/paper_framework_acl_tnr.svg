  <rect x="886" y="316" width="288" height="154" rx="10" fill="#E6F3EC" stroke="#529E78" stroke-width="1.15"/>
  <text x="1162" y="336" text-anchor="end" font-size="15" font-style="italic" fill="#1F2937">Training</text>

  <!-- Left mini bar chart z^(a) -->
  <text x="945" y="355" text-anchor="middle" font-size="16.5"><tspan class="math-b">z</tspan><tspan dy="-5" font-size="11.5">(<tspan class="math-it">a</tspan>)</tspan></text>
  <line x1="910" y1="366" x2="910" y2="418" stroke="#334155" stroke-width="1.2"/>
