  <text x="1030" y="457" text-anchor="middle" font-size="17.5">
    <tspan class="math-it">L</tspan> = <tspan class="math-it">L</tspan><tspan dy="3" font-size="11.5">CE</tspan><tspan dy="-3"> + </tspan><tspan class="math-it">λ</tspan> · <tspan class="math-it">L</tspan><tspan dy="3" font-size="11.5">flip</tspan>
  </text>

