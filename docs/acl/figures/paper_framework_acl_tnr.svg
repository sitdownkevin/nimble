  <text x="1030" y="401" text-anchor="middle" font-size="14.5">margin</text>

  <!-- Right mini bar chart z^(b) -->
  <text x="1116" y="355" text-anchor="middle" font-size="16.5"><tspan class="math-b">z</tspan><tspan dy="-5" font-size="11.5">(<tspan class="math-it">b</tspan>)</tspan></text>
  <line x1="1081" y1="366" x2="1081" y2="418" stroke="#334155" stroke-width="1.2"/>
