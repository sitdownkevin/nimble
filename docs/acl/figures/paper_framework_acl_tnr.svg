  <rect x="498" y="316" width="204" height="292" rx="10" fill="#EBF2FA" class="stroke-main"/>
  <text x="600" y="340" text-anchor="middle" font-size="16" font-weight="700">Qwen3.5 Hybrid Backbone</text>
  <text x="600" y="359" text-anchor="middle" font-size="14" font-style="italic" fill="#334155">shared weights, co-batched</text>

  <!-- 3x Gated DeltaNet + 1x Full Attention -->
  <rect x="510" y="374" width="144" height="45" rx="6" fill="#C4E1D2" class="stroke-main"/>
  <text x="582" y="402" text-anchor="middle" font-size="15.5">Gated DeltaNet</text>

  <rect x="510" y="431" width="144" height="45" rx="6" fill="#C4E1D2" class="stroke-main"/>
  <text x="582" y="459" text-anchor="middle" font-size="15.5">Gated DeltaNet</text>

  <rect x="510" y="488" width="144" height="45" rx="6" fill="#C4E1D2" class="stroke-main"/>
  <text x="582" y="516" text-anchor="middle" font-size="15.5">Gated DeltaNet</text>

  <rect x="510" y="545" width="144" height="45" rx="6" fill="#BBD5F2" class="stroke-main"/>
  <text x="582" y="573" text-anchor="middle" font-size="15.5">Full Attention</text>

