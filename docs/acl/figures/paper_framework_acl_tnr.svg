  <path d="M 771,426 L 761,426 L 761,498 L 771,498" fill="none" stroke="#1E293B" stroke-width="1.8"/>
  <path d="M 807,426 L 817,426 L 817,498 L 807,498" fill="none" stroke="#1E293B" stroke-width="1.8"/>
  <text x="789" y="469" text-anchor="middle" font-size="22">[ · ]</text>

  <text x="789" y="523" text-anchor="middle" font-size="15.5"><tspan class="math-it">W</tspan><tspan dy="3" font-size="11">lm</tspan><tspan dy="-3">[<tspan class="math-it">c</tspan></tspan><tspan dy="3" font-size="11">1</tspan><tspan dy="-3">, …, <tspan class="math-it">c</tspan></tspan><tspan dy="3" font-size="11" class="math-it">K</tspan><tspan dy="-3">]</tspan></text>
  <text x="789" y="544" text-anchor="middle" font-size="15">(<tspan class="math-it">K</tspan> ≤ 26)</text>

  <!-- Branching arrows to Training (solid) and Inference (dashed) -->
  <path d="M 822,462 L 858,462 L 858,392 L 882,392" class="arrow-line" marker-end="url(#arr)"/>
  <path d="M 858,462 L 858,566 L 882,566" class="arrow-dash" marker-end="url(#arr)"/>
  <text x="843" y="449" text-anchor="middle" font-size="15.5"><tspan class="math-b">z</tspan><tspan dy="-5" font-size="11">(<tspan class="math-it">a</tspan>)</tspan><tspan dy="5">,</tspan></text>
  <text x="843" y="486" text-anchor="middle" font-size="15.5"><tspan class="math-b">z</tspan><tspan dy="-5" font-size="11">(<tspan class="math-it">b</tspan>)</tspan></text>

