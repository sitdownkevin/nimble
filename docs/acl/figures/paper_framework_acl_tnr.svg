<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <style>
      @font-face {
        font-family: 'TNR';
        src: url('file:///System/Library/Fonts/Supplemental/Times%20New%20Roman.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: 'TNR';
        src: url('file:///System/Library/Fonts/Supplemental/Times%20New%20Roman%20Bold.ttf') format('truetype');
        font-weight: 700;
        font-style: normal;
      }
      @font-face {
        font-family: 'TNR';
        src: url('file:///System/Library/Fonts/Supplemental/Times%20New%20Roman%20Italic.ttf') format('truetype');
        font-weight: 400;
        font-style: italic;
      }
      @font-face {
        font-family: 'TNR';
        src: url('file:///System/Library/Fonts/Supplemental/Times%20New%20Roman%20Bold%20Italic.ttf') format('truetype');
        font-weight: 700;
        font-style: italic;
      }
      text {
        font-family: 'TNR', 'Times New Roman', Times, serif;
        fill: #1A202C;
      }
      .title-bold { font-size: 19px; font-weight: 700; }
      .title-reg  { font-size: 19px; font-weight: 400; }
      .col-title  { font-size: 17.5px; font-weight: 700; }
      .lbl        { font-size: 16px; font-weight: 400; }
      .lbl-sm     { font-size: 14.5px; font-weight: 400; }
      .lbl-xs     { font-size: 13.5px; font-weight: 400; }
      .lbl-it     { font-size: 15px; font-style: italic; fill: #334155; }
      .lbl-muted  { font-size: 15.5px; font-style: italic; fill: #526071; }
      .math-it    { font-style: italic; }
      .math-bi    { font-weight: 700; font-style: italic; }
      .math-b     { font-weight: 700; }
      .stroke-main { stroke: #475569; stroke-width: 1.15; }
      .arrow-line  { stroke: #475569; stroke-width: 1.35; fill: none; }
      .arrow-dash  { stroke: #526071; stroke-width: 1.35; stroke-dasharray: 5,4; fill: none; }
      .brace       { stroke: #475569; stroke-width: 1.1; fill: none; }
    </style>

    <linearGradient id="decayFillA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D98A8C" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#D98A8C" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="decayFillB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D98A8C" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#D98A8C" stop-opacity="0.14"/>
    </linearGradient>

    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#C4787B"/>
    </marker>
  </defs>

  <!-- Pure white background -->
  <rect x="0" y="0" width="1200" height="675" fill="#FFFFFF"/>

  <!-- ==================== PANEL (a) ==================== -->
  <text x="26" y="34">
    <tspan class="title-bold">(a) Official Baseline v1:</tspan>
    <tspan class="title-reg"> Blind Context Compression &amp; Tail Decay on Hybrid Gated DeltaNet</tspan>
  </text>

  <!-- Blind reading note above Context -->
  <text x="350" y="84" text-anchor="middle" class="lbl-muted">(no task prior → blind recurrent compression)</text>

  <!-- Decay curve above JSON Schema & Choices -> Field (x=644..986) -->
  <path d="M 644,94 L 644,53 Q 775,80 982,89 L 982,94 Z" fill="url(#decayFillA)"/>
  <path d="M 644,53 Q 775,80 980,89" fill="none" stroke="#C4787B" stroke-width="1.8" marker-end="url(#arr-rose)"/>
  <text x="842" y="69" text-anchor="middle" font-size="16.5">∏<tspan class="math-it">α</tspan><tspan dy="4" font-size="11.5" class="math-it">t</tspan><tspan dy="-4"> = 0.264</tspan></text>

  <!-- Panel (a) Horizontal Token Tape (y=98..146) -->
  <!-- Segment 1: JSON Context -->
  <path d="M 64,98 L 644,98 L 644,146 L 64,146 Q 58,146 58,140 L 58,104 Q 58,98 64,98 Z" fill="#E8C98F" class="stroke-main"/>
  <text x="351" y="128" text-anchor="middle" font-size="17.5">JSON Context: {"context": "...\"fee: 5%\"..."}</text>

  <!-- Segment 2: JSON Schema & Choices -->
  <rect x="644" y="98" width="264" height="48" fill="#E1A8AA" class="stroke-main"/>
  <text x="776" y="128" text-anchor="middle" font-size="17.5">JSON Schema &amp; Choices</text>

  <!-- Segment 3: Field -->
  <path d="M 908,98 L 982,98 Q 988,98 988,104 L 988,140 Q 988,146 982,146 L 908,146 Z" fill="#E2E5E9" class="stroke-main"/>
  <text x="948" y="128" text-anchor="middle" font-size="17.5">Field</text>

  <!-- Readout arrow & label -->
  <line x1="988" y1="122" x2="1044" y2="122" class="arrow-line" marker-end="url(#arr)"/>
  <text x="1054" y="128" font-size="19">Readout <tspan class="math-bi">h</tspan><tspan dy="4" font-size="13" class="math-it">T</tspan></text>

  <!-- Curly braces under Panel (a) tape -->
  <path d="M 60,152 Q 60,161 72,161 L 339,161 Q 351,161 351,169 Q 351,161 363,161 L 630,161 Q 642,161 642,152" class="brace"/>
  <text x="351" y="191" text-anchor="middle" font-size="16.5">Raw JSON-escaped context</text>

  <path d="M 646,152 Q 646,161 658,161 L 804,161 Q 816,161 816,169 Q 816,161 828,161 L 974,161 Q 986,161 986,152" class="brace"/>
  <text x="816" y="191" text-anchor="middle" font-size="16.5">Avg readout distance = 166 tok</text>

  <!-- Horizontal Dashed Divider -->
  <line x1="26" y1="216" x2="1174" y2="216" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="6,5"/>

  <!-- ==================== PANEL (b) ==================== -->
  <text x="26" y="248">
    <tspan class="title-bold">(b) Proposed Method:</tspan>
    <tspan class="title-reg"> Task-Guided Sandwich-v3, Counterfactual Co-Batching, and Zero-Leakage Calibration</tspan>
  </text>

  <!-- Column Headers -->
  <text x="241" y="280" text-anchor="middle" class="col-title">Counterfactual Pair Inputs</text>
  <text x="241" y="301" text-anchor="middle" font-size="16">(PairBatchSampler)</text>

  <text x="676" y="290" text-anchor="middle" class="col-title">Hybrid Backbone &amp; Projection</text>

  <text x="1031" y="280" text-anchor="middle" class="col-title">Dual-Branch Objective</text>
  <text x="1031" y="301" text-anchor="middle" class="col-title">&amp; Calibration</text>

  <!-- ==================== COLUMN 1: PAIR INPUTS ==================== -->
  <rect x="24" y="316" width="434" height="292" rx="12" fill="#FBF7EE" stroke="#94A3B8" stroke-width="1.15" stroke-dasharray="5,4"/>

  <!-- Retention curve above upper Choices (70 tok) (x=318..444) -->
  <path d="M 318,376 L 318,354 Q 380,364 442,368 L 442,376 Z" fill="url(#decayFillB)"/>
  <path d="M 318,354 Q 380,364 440,368" fill="none" stroke="#C4787B" stroke-width="1.7" marker-end="url(#arr-rose)"/>
  <text x="372" y="346" text-anchor="middle" font-size="15.5">∏<tspan class="math-it">α</tspan><tspan dy="3" font-size="11" class="math-it">t</tspan><tspan dy="-3"> = 0.300 </tspan><tspan fill="#207A4C">(+13.7%)</tspan></text>

  <!-- Upper Tape x^(a) (y=380..442) -->
  <text x="60" y="405" text-anchor="middle" font-size="17"><tspan class="math-b">x</tspan><tspan dy="-6" font-size="12">(<tspan class="math-it">a</tspan>)</tspan></text>
  <text x="60" y="427" text-anchor="middle" class="lbl-sm">(gold: A)</text>

  <path d="M 102,380 L 178,380 L 178,442 L 102,442 Q 96,442 96,436 L 96,386 Q 96,380 102,380 Z" fill="#CFE0F5" class="stroke-main"/>
  <text x="137" y="406" text-anchor="middle" font-size="15.5">Task</text>
  <text x="137" y="427" text-anchor="middle" font-size="14.5">(~40 tok)</text>

  <rect x="178" y="380" width="140" height="62" fill="#D5E7DE" class="stroke-main"/>
  <text x="248" y="405" text-anchor="middle" font-size="15.5">Clean Context</text>
  <rect x="225" y="414" width="46" height="20" rx="4" fill="#A9DCBC"/>
  <text x="248" y="429" text-anchor="middle" font-size="14.5">(… fee 5% …)</text>

  <path d="M 318,380 L 438,380 Q 444,380 444,386 L 444,436 Q 444,442 438,442 L 318,442 Z" fill="#E8C98F" class="stroke-main"/>
  <text x="381" y="406" text-anchor="middle" font-size="15.5">Choices</text>
  <text x="381" y="427" text-anchor="middle" font-size="14.5">(70 tok)</text>

  <!-- Minimal edit double arrow -->
  <line x1="248" y1="448" x2="248" y2="495" class="arrow-line" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="259" y="476" font-size="15.5">minimal edit <tspan class="math-b">δx</tspan></text>

  <!-- Lower Tape x^(b) (y=502..564) -->
  <text x="60" y="527" text-anchor="middle" font-size="17"><tspan class="math-b">x</tspan><tspan dy="-6" font-size="12">(<tspan class="math-it">b</tspan>)</tspan></text>
  <text x="60" y="549" text-anchor="middle" class="lbl-sm">(gold: B)</text>

  <path d="M 102,502 L 178,502 L 178,564 L 102,564 Q 96,564 96,558 L 96,508 Q 96,502 102,502 Z" fill="#CFE0F5" class="stroke-main"/>
  <text x="137" y="528" text-anchor="middle" font-size="15.5">Task</text>
  <text x="137" y="549" text-anchor="middle" font-size="14.5">(~40 tok)</text>

  <rect x="178" y="502" width="140" height="62" fill="#D5E7DE" class="stroke-main"/>
  <text x="248" y="527" text-anchor="middle" font-size="15.5">Clean Context</text>
  <rect x="221" y="536" width="54" height="20" rx="4" fill="#F0B1AD"/>
  <text x="248" y="551" text-anchor="middle" font-size="14.5">(… fee 50% …)</text>

  <path d="M 318,502 L 438,502 Q 444,502 444,508 L 444,558 Q 444,564 438,564 L 318,564 Z" fill="#E8C98F" class="stroke-main"/>
  <text x="381" y="528" text-anchor="middle" font-size="15.5">Choices</text>
  <text x="381" y="549" text-anchor="middle" font-size="14.5">(70 tok)</text>

  <!-- Captions below Column 1 -->
  <text x="241" y="633" text-anchor="middle" font-size="16">Order-Preserving &amp; Sync Choice Shuffle</text>
  <text x="241" y="656" text-anchor="middle" font-size="15.5" fill="#334155">2.36× shorter readout distance · −7.13% tokens</text>

  <!-- Arrows from Col 1 to Backbone -->
  <line x1="444" y1="411" x2="495" y2="411" class="arrow-line" marker-end="url(#arr)"/>
  <line x1="444" y1="533" x2="495" y2="533" class="arrow-line" marker-end="url(#arr)"/>

