  <!-- Caption below Backbone -->
  <text x="600" y="633" text-anchor="middle" font-size="16">3:1 hybrid layers</text>
  <text x="600" y="656" text-anchor="middle" font-size="15.5" fill="#334155">(75% linear / 25% full)</text>

  <!-- Arrows Backbone -> FP32 Candidate Head -->
  <line x1="702" y1="438" x2="752" y2="438" class="arrow-line" marker-end="url(#arr)"/>
  <text x="727" y="427" text-anchor="middle" font-size="15.5"><tspan class="math-bi">h</tspan><tspan dy="4" font-size="11" class="math-it">T</tspan><tspan dy="-10" dx="-5" font-size="11">(<tspan class="math-it">a</tspan>)</tspan></text>

  <line x1="702" y1="486" x2="752" y2="486" class="arrow-line" marker-end="url(#arr)"/>
  <text x="727" y="509" text-anchor="middle" font-size="15.5"><tspan class="math-bi">h</tspan><tspan dy="4" font-size="11" class="math-it">T</tspan><tspan dy="-10" dx="-5" font-size="11">(<tspan class="math-it">b</tspan>)</tspan></text>

