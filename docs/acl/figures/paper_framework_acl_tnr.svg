  <rect x="1091" y="403" width="20" height="15" fill="#E0B167" stroke="#475569" stroke-width="0.9"/>
  <rect x="1119" y="370" width="20" height="48" fill="#7EA6DA" stroke="#475569" stroke-width="0.9"/>
  <text x="1101" y="433" text-anchor="middle" class="lbl-xs">A</text>
  <text x="1129" y="433" text-anchor="middle" class="lbl-xs">B</text>

