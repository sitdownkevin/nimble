<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nimble Studio</title>
  <style>
    html, body, #root { height: 100%; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    * { box-sizing: border-box; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(95, 99, 104, 0.24); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(95, 99, 104, 0.42); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="/static/app.js"></script>
</body>
</html>
